name: Deploy Frontend to ECS (Final)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sabpaisa-tokenization-frontend
  ECS_CLUSTER: sabpaisa-tokenization-cluster
  ECS_SERVICE: sabpaisa-tokenization-frontend
  CONTAINER_NAME: frontend
  TASK_FAMILY: sabpaisa-tokenization-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Phase 1 - Infrastructure Discovery
      id: infra
      run: |
        echo "🔍 Phase 1: Infrastructure Discovery"
        echo "===================================="
        
        # Get AWS account info
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        
        echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        
        # Ensure ECR repository exists
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY 2>/dev/null || \
        aws ecr create-repository --repository-name $ECR_REPOSITORY --image-scanning-configuration scanOnPush=true
        
        REPOSITORY_URI=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query 'repositories[0].repositoryUri' --output text)
        echo "repository_uri=$REPOSITORY_URI" >> $GITHUB_OUTPUT
        
        # Find ALB - try specific name first
        ALB_ARN=""
        ALB_DNS=""
        ALB_VPC=""
        
        # Try to find sabpaisa-tokenization-alb
        ALB_INFO=$(aws elbv2 describe-load-balancers --names sabpaisa-tokenization-alb 2>/dev/null || echo "")
        if [ ! -z "$ALB_INFO" ]; then
          ALB_ARN=$(echo "$ALB_INFO" | grep -o '"LoadBalancerArn": "[^"]*"' | cut -d'"' -f4 || echo "")
          ALB_DNS=$(echo "$ALB_INFO" | grep -o '"DNSName": "[^"]*"' | cut -d'"' -f4 || echo "")
          ALB_VPC=$(echo "$ALB_INFO" | grep -o '"VpcId": "[^"]*"' | cut -d'"' -f4 || echo "")
        fi
        
        # If not found, get first available ALB
        if [ -z "$ALB_ARN" ]; then
          echo "Specific ALB not found, getting first available ALB..."
          ALB_INFO=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[0]' --output json 2>/dev/null || echo "{}")
          ALB_ARN=$(echo "$ALB_INFO" | grep -o '"LoadBalancerArn": "[^"]*"' | cut -d'"' -f4 || echo "")
          ALB_DNS=$(echo "$ALB_INFO" | grep -o '"DNSName": "[^"]*"' | cut -d'"' -f4 || echo "")
          ALB_VPC=$(echo "$ALB_INFO" | grep -o '"VpcId": "[^"]*"' | cut -d'"' -f4 || echo "")
        fi
        
        echo "alb_arn=$ALB_ARN" >> $GITHUB_OUTPUT
        echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
        
        # Determine VPC
        if [ ! -z "$ALB_VPC" ]; then
          VPC_ID=$ALB_VPC
          echo "Using ALB VPC: $VPC_ID"
        else
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query 'Vpcs[0].VpcId' --output text)
          echo "Using default VPC: $VPC_ID"
        fi
        echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
        
        # Get subnets from VPC
        SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text)
        SUBNET_1=$(echo $SUBNETS | cut -d' ' -f1)
        SUBNET_2=$(echo $SUBNETS | cut -d' ' -f2)
        
        if [ -z "$SUBNET_2" ]; then
          SUBNET_2=$SUBNET_1
        fi
        
        echo "subnet_1=$SUBNET_1" >> $GITHUB_OUTPUT
        echo "subnet_2=$SUBNET_2" >> $GITHUB_OUTPUT
        
        # Set backend URL
        if [ ! -z "$ALB_DNS" ]; then
          BACKEND_URL="http://$ALB_DNS/tokenization-backend"
        else
          BACKEND_URL="http://localhost:8080/tokenization-backend"
        fi
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        
        echo "✅ Infrastructure Discovery Complete"
        echo "Account: $ACCOUNT_ID"
        echo "VPC: $VPC_ID"
        echo "Subnets: $SUBNET_1, $SUBNET_2"
        echo "ALB: ${ALB_DNS:-Not found}"
        
    - name: Phase 2 - Build and Push Docker Image
      id: docker
      run: |
        echo "🐳 Phase 2: Building and Pushing Docker Image"
        echo "==========================================="
        
        IMAGE_TAG="${{ steps.infra.outputs.timestamp }}"
        IMAGE_URI="${{ steps.infra.outputs.repository_uri }}:$IMAGE_TAG"
        
        echo "Building image: $IMAGE_URI"
        docker build \
          --build-arg REACT_APP_API_URL="${{ steps.infra.outputs.backend_url }}" \
          -t $IMAGE_URI .
        
        echo "Pushing image to ECR..."
        docker push $IMAGE_URI
        docker tag $IMAGE_URI ${{ steps.infra.outputs.repository_uri }}:latest
        docker push ${{ steps.infra.outputs.repository_uri }}:latest
        
        echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
        echo "✅ Docker image built and pushed successfully"
        
    - name: Phase 3 - Create Network Resources
      id: network
      run: |
        echo "🔒 Phase 3: Creating Network Resources"
        echo "===================================="
        
        # Create Security Group
        SG_NAME="frontend-sg-${{ steps.infra.outputs.timestamp }}"
        SG_ID=$(aws ec2 create-security-group \
          --group-name $SG_NAME \
          --description "Frontend security group" \
          --vpc-id ${{ steps.infra.outputs.vpc_id }} \
          --query 'GroupId' \
          --output text)
        
        # Allow HTTP traffic
        aws ec2 authorize-security-group-ingress \
          --group-id $SG_ID \
          --protocol tcp \
          --port 80 \
          --cidr 0.0.0.0/0
        
        echo "security_group=$SG_ID" >> $GITHUB_OUTPUT
        
        # Create Target Group
        TG_NAME="fe-tg-${{ steps.infra.outputs.timestamp }}"
        # Truncate to 32 characters if needed
        TG_NAME=${TG_NAME:0:32}
        
        TG_ARN=$(aws elbv2 create-target-group \
          --name $TG_NAME \
          --protocol HTTP \
          --port 80 \
          --vpc-id ${{ steps.infra.outputs.vpc_id }} \
          --target-type ip \
          --health-check-protocol HTTP \
          --health-check-path / \
          --health-check-interval-seconds 30 \
          --health-check-timeout-seconds 5 \
          --healthy-threshold-count 2 \
          --unhealthy-threshold-count 3 \
          --query 'TargetGroups[0].TargetGroupArn' \
          --output text)
        
        echo "target_group_arn=$TG_ARN" >> $GITHUB_OUTPUT
        echo "✅ Network resources created"
        echo "Security Group: $SG_ID"
        echo "Target Group: $TG_ARN"
        
    - name: Phase 4 - Configure Load Balancer
      id: alb
      run: |
        echo "🔧 Phase 4: Configuring Load Balancer"
        echo "===================================="
        
        if [ ! -z "${{ steps.infra.outputs.alb_arn }}" ]; then
          echo "ALB found: ${{ steps.infra.outputs.alb_arn }}"
          
          # Get HTTP listener
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn ${{ steps.infra.outputs.alb_arn }} \
            --query 'Listeners[?Port==`80`].ListenerArn | [0]' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$LISTENER_ARN" ] || [ "$LISTENER_ARN" == "None" ]; then
            echo "Creating HTTP listener..."
            LISTENER_ARN=$(aws elbv2 create-listener \
              --load-balancer-arn ${{ steps.infra.outputs.alb_arn }} \
              --protocol HTTP \
              --port 80 \
              --default-actions Type=forward,TargetGroupArn=${{ steps.network.outputs.target_group_arn }} \
              --query 'Listeners[0].ListenerArn' \
              --output text)
            echo "listener_configured=true" >> $GITHUB_OUTPUT
          else
            echo "Listener exists, creating rule..."
            # Generate random priority
            PRIORITY=$((RANDOM % 50000 + 1))
            
            # Try to create a rule
            if aws elbv2 create-rule \
              --listener-arn $LISTENER_ARN \
              --priority $PRIORITY \
              --conditions Field=path-pattern,Values="/*" \
              --actions Type=forward,TargetGroupArn=${{ steps.network.outputs.target_group_arn }} \
              2>/dev/null; then
              echo "✅ Created listener rule with priority $PRIORITY"
              echo "listener_configured=true" >> $GITHUB_OUTPUT
            else
              echo "Rule creation failed, updating default action..."
              aws elbv2 modify-listener \
                --listener-arn $LISTENER_ARN \
                --default-actions Type=forward,TargetGroupArn=${{ steps.network.outputs.target_group_arn }}
              echo "✅ Updated default listener action"
              echo "listener_configured=true" >> $GITHUB_OUTPUT
            fi
          fi
        else
          echo "⚠️  No ALB available, service will run without load balancer"
          echo "listener_configured=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Phase 5 - Create ECS Resources
      id: ecs
      run: |
        echo "📦 Phase 5: Creating ECS Resources"
        echo "================================="
        
        # Ensure IAM role exists
        aws iam get-role --role-name ecsTaskExecutionRole 2>/dev/null || \
        (aws iam create-role --role-name ecsTaskExecutionRole \
          --assume-role-policy-document '{
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "ecs-tasks.amazonaws.com"},
              "Action": "sts:AssumeRole"
            }]
          }' && \
        aws iam attach-role-policy \
          --role-name ecsTaskExecutionRole \
          --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy)
        
        # Create CloudWatch log group
        aws logs create-log-group --log-group-name /ecs/$ECS_SERVICE 2>/dev/null || true
        
        # Register task definition
        cat > /tmp/task-definition.json <<EOF
        {
          "family": "$TASK_FAMILY",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "512",
          "memory": "1024",
          "executionRoleArn": "arn:aws:iam::${{ steps.infra.outputs.account_id }}:role/ecsTaskExecutionRole",
          "containerDefinitions": [
            {
              "name": "$CONTAINER_NAME",
              "image": "${{ steps.docker.outputs.image_uri }}",
              "portMappings": [{
                "containerPort": 80,
                "protocol": "tcp"
              }],
              "essential": true,
              "environment": [{
                "name": "REACT_APP_API_URL",
                "value": "${{ steps.infra.outputs.backend_url }}"
              }],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/$ECS_SERVICE",
                  "awslogs-region": "$AWS_REGION",
                  "awslogs-stream-prefix": "ecs"
                }
              }
            }
          ]
        }
        EOF
        
        aws ecs register-task-definition --cli-input-json file:///tmp/task-definition.json
        
        # Clean up old service
        echo "Cleaning up old service if exists..."
        aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --desired-count 0 2>/dev/null || true
        aws ecs delete-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force 2>/dev/null || true
        sleep 10
        
        echo "✅ ECS resources prepared"
        
    - name: Phase 6 - Deploy Service
      id: deploy
      run: |
        echo "🚀 Phase 6: Deploying ECS Service"
        echo "================================"
        
        # Build network configuration
        NETWORK_CONFIG="{
          \"awsvpcConfiguration\": {
            \"subnets\": [\"${{ steps.infra.outputs.subnet_1 }}\", \"${{ steps.infra.outputs.subnet_2 }}\"],
            \"securityGroups\": [\"${{ steps.network.outputs.security_group }}\"],
            \"assignPublicIp\": \"ENABLED\"
          }
        }"
        
        # Create service with or without load balancer
        if [ "${{ steps.alb.outputs.listener_configured }}" == "true" ]; then
          echo "Creating service with load balancer..."
          aws ecs create-service \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --task-definition $TASK_FAMILY \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --load-balancers "[{
              \"targetGroupArn\": \"${{ steps.network.outputs.target_group_arn }}\",
              \"containerName\": \"$CONTAINER_NAME\",
              \"containerPort\": 80
            }]" \
            --health-check-grace-period-seconds 120
        else
          echo "Creating service without load balancer..."
          aws ecs create-service \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --task-definition $TASK_FAMILY \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG"
        fi
        
        echo "✅ Service deployment initiated"
        
        # Wait a bit for service to start
        echo "Waiting for service to stabilize..."
        sleep 30
        
        # Get service status
        SERVICE_STATUS=$(aws ecs describe-services \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE \
          --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount}' \
          --output json)
        
        echo "Service Status:"
        echo "$SERVICE_STATUS"
        
    - name: Deployment Summary
      if: always()
      run: |
        echo "📊 Deployment Summary"
        echo "===================="
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Docker Image: ${{ steps.docker.outputs.image_uri || 'Not built' }}"
        echo "ECS Service: $ECS_SERVICE"
        echo ""
        
        if [ ! -z "${{ steps.infra.outputs.alb_dns }}" ]; then
          echo "🌐 Frontend URL: http://${{ steps.infra.outputs.alb_dns }}"
          echo "🔗 Backend URL: ${{ steps.infra.outputs.backend_url }}"
        else
          echo "⚠️  No ALB configured. Checking for task public IP..."
          
          # Try to get task public IP
          TASK_ARN=$(aws ecs list-tasks --cluster $ECS_CLUSTER --service-name $ECS_SERVICE --query 'taskArns[0]' --output text 2>/dev/null || echo "")
          if [ ! -z "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            sleep 20
            ENI_ID=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' --output text 2>/dev/null || echo "")
            if [ ! -z "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
              PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query 'NetworkInterfaces[0].Association.PublicIp' --output text 2>/dev/null || echo "")
              if [ ! -z "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
                echo "📍 Direct Task Access: http://$PUBLIC_IP"
              fi
            fi
          fi
        fi
        
        echo ""
        echo "📋 AWS Console Links:"
        echo "ECS Service: https://console.aws.amazon.com/ecs/home?region=$AWS_REGION#/clusters/$ECS_CLUSTER/services/$ECS_SERVICE/tasks"
        
        if [ "${{ steps.alb.outputs.listener_configured }}" == "true" ]; then
          echo "Target Group: https://console.aws.amazon.com/ec2/v2/home?region=$AWS_REGION#TargetGroups"
        fi
        
        echo ""
        echo "⏳ Note: Service may take 2-3 minutes to become fully healthy."